<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Duo</title>
<link rel="icon" type="image/png" href="data:image/png;base64,%%FAVICON%%">
<style>
:root{
  --celeste:#74ACDF; --celeste-d:#3f7fb8; --celeste-l:#e8f2fb;
  --gold:#F6B40E; --gold-l:#fff4d6; --brown:#85340A;
  --ink:#1f2933; --muted:#5f6b76; --line:#d9e2ea; --bg:#f5f8fb; --card:#fff;
  --ok:#1e7b45; --ok-l:#e3f5ea; --warn:#a35a00; --warn-l:#fff1dc; --err:#b3261e; --err-l:#fde8e6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
header{position:relative;background:#6d93b8 url("data:image/jpeg;base64,%%PHOTO%%") center 42%/cover no-repeat;border-bottom:3px solid var(--gold)}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.12) 55%,rgba(0,0,0,.15))}
header .hwrap{position:relative}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 18px}
.logo{width:86px;height:86px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.brand h1{margin:0;font-size:38px;letter-spacing:2px;color:#D7261E;font-weight:800;line-height:1;text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 8px #fff}
.brand h1 span{color:#5a9bd8;letter-spacing:8px;margin-left:8px}
.brand p{margin:6px 0 0;color:#1f2933;font-size:14px;font-weight:700;text-shadow:0 0 3px #fff,0 0 6px #fff}
.hright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lang{display:flex;gap:4px}
.lang button{border:1px solid rgba(0,0,0,.15);background:#fff;border-radius:6px;padding:3px 8px;font-weight:700;cursor:pointer;font-size:12px;color:var(--ink)}
.lang button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--celeste-d)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.gold{background:var(--gold);border-color:#d99a00;color:#3b2200}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .nwrap{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--celeste-l);color:var(--celeste-d);font-size:12px;margin-right:6px}
nav button.on{color:var(--brown);border-bottom-color:var(--gold)}
nav button.on .n{background:var(--gold);color:#3b2200}
nav button[hidden]{display:none}
main{max-width:1180px;margin:0 auto;padding:18px}
section.tab{display:none}
section.tab.on{display:block}
h2{margin:4px 0 4px;font-size:22px;color:var(--brown)}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f small{font-weight:400}
input,select{font:inherit;padding:7px 9px;border:1px solid #c7d3de;border-radius:7px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--celeste);border-color:var(--celeste-d)}
input[type=number]{text-align:right}
.seg{display:flex;gap:0;border:1px solid #c7d3de;border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:#fff;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid #c7d3de}
.seg button.on{background:var(--celeste-d);color:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#loads input{width:100%}
#loads td:nth-child(1){min-width:170px}
#loads td:nth-child(n+2):nth-child(-n+8) input{width:74px}
#loads td{padding:5px 4px}
details.kuks summary{cursor:pointer;font-weight:700;font-size:16px}
details.kuks[open] summary{margin-bottom:10px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.kgrid h4{margin:0 0 6px;font-size:14px;color:var(--brown)}
table.ref td,table.ref th{padding:4px 8px;font-size:13px}
.prot{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.prot h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;text-transform:uppercase;letter-spacing:.3px}
.tag.ob{background:#fde8e6;color:#b3261e}.tag.rec{background:#fff1dc;color:#a35a00}.tag.ok{background:#e3f5ea;color:#1e7b45}
.prot .ref{font-family:Consolas,Menlo,monospace;font-size:13px;background:var(--gold-l);border-radius:6px;padding:2px 6px}
.prot ul{margin:6px 0 0 18px;padding:0}.prot li{margin:2px 0}
#schemaProt,#schemaProt2{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.doc table{font-size:13px}
.doc tr.pick{cursor:pointer}
.doc tr.pick:hover td{background:#f3f8fd}
.doc tr.sel td{background:#ffe9a8!important;font-weight:700}
.doc tr.sel td:first-child::before{content:"✔ ";color:#1e7b45}
.doc tr.nok td{color:#9aa5b1}
.doc h3 a,.doc td a{color:var(--celeste-d);font-weight:600;font-size:12px}
.doc .scroll{overflow-x:auto}
.cpl{overflow-x:auto;margin-top:10px}.cpl svg{display:block;max-width:100%;height:auto}
.cpl p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.del{border:0;background:none;color:var(--err);cursor:pointer;font-size:18px;line-height:1}
tfoot td{font-weight:700;background:var(--gold-l)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:4px}
.kpi{background:var(--celeste-l);border-radius:10px;padding:10px 12px;border-left:4px solid var(--celeste-d)}
.kpi.g{background:var(--gold-l);border-left-color:var(--gold)}
.kpi b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.formula{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:13.5px;background:#fbfcfd;border:1px dashed #c9d6e2;border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.formula .t{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--brown);display:block;white-space:normal;margin-bottom:2px;font-size:13px}
.msg{border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
.msg.ok{background:var(--ok-l);color:var(--ok)}
.msg.warn{background:var(--warn-l);color:var(--warn)}
.msg.err{background:var(--err-l);color:var(--err)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.hint a{color:var(--celeste-d)}
.navbtns{display:flex;justify-content:space-between;margin-top:6px}
#synop{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
footer{max-width:1180px;margin:10px auto 30px;padding:0 18px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.printonly{display:none}
@media (max-width:640px){.logo{width:60px;height:60px}.brand h1{font-size:24px}.hwrap{flex-wrap:wrap}.hright{margin-left:0;align-items:flex-start}}
@media print{
  header,nav,.navbtns,.tools,.lang,.noprint,footer{display:none!important}
  body{background:#fff;font-size:12px}
  main{padding:0;max-width:none}
  section.tab{display:none!important}
  section#t-sum{display:block!important}
  .card{break-inside:avoid;border-color:#bbb}
  .card.big{break-inside:auto}
  .formula{white-space:normal;break-inside:avoid}
  .printonly{display:flex!important;align-items:center;gap:12px;border-bottom:3px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
  .printonly svg{width:60px;height:60px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <svg class="logo" viewBox="-215 -215 430 430" aria-hidden="true">%%SUN%%</svg>
    <div class="brand">
      <h1>SOLAR<span>DUO</span></h1>
      <p data-i="tagline"></p>
    </div>
    <div class="hright">
      <div class="lang" id="langs"></div>
      <div class="tools">
        <button class="btn" id="bNew" data-i="new"></button>
        <button class="btn" id="bOpen" data-i="open"></button>
        <button class="btn" id="bSave" data-i="save"></button>
        <button class="btn gold" id="bPrint" data-i="print"></button>
        <input type="file" id="fOpen" accept=".json,.solarduo" hidden>
      </div>
    </div>
  </div>
</header>

<nav><div class="nwrap" id="tabs"></div></nav>

<main>
<!-- 1. PROJET & SITE -->
<section class="tab" id="t-site">
  <h2 data-i="t_site"></h2>
  <p class="lead" data-i="site_lead"></p>
  <div class="card">
    <h3 data-i="project"></h3>
    <div class="grid">
      <label class="f"><span data-i="pname"></span><input id="pName"></label>
      <label class="f"><span data-i="pauthor"></span><input id="pAuthor"></label>
      <label class="f"><span data-i="examples"></span><select id="exSel"></select></label>
    </div>
    <div id="exMsg"></div>
    <h3 style="margin-top:16px" data-i="mode"></h3>
    <div class="seg" id="modeSeg">
      <button data-v="isole" data-i="m_isole"></button>
      <button data-v="reseau" data-i="m_reseau"></button>
    </div>
    <p class="hint" id="modeHint"></p>
  </div>
  <div class="card">
    <h3 data-i="sun"></h3>
    <div class="grid">
      <label class="f"><span data-i="city"></span><select id="city"></select></label>
      <label class="f iso"><span data-i="period"></span>
        <select id="period">
          <option value="year" data-i="per_year"></option>
          <option value="summer" data-i="per_summer"></option>
          <option value="avg" data-i="per_avg"></option>
        </select></label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label class="f"><span data-i="h_dec"></span><input type="number" step="10" min="100" id="hDec"></label>
      <label class="f"><span data-i="h_sum"></span><input type="number" step="10" min="100" id="hSum"></label>
      <label class="f"><span data-i="h_year"></span><input type="number" step="10" min="100" id="hYear"></label>
    </div>
    <p class="hint" data-i="sun_hint"></p>
    <div class="res" id="rSite"></div>
  </div>
  <div class="navbtns"><span></span><button class="btn primary" data-go="1" data-i="next"></button></div>
</section>

<!-- 2. CONSOMMATION -->
<section class="tab" id="t-loads">
  <h2 data-i="t_loads"></h2>
  <p class="lead" id="loadsLead"></p>
  <details class="card iso kuks">
    <summary data-i="kuks_title"></summary>
    <div class="kgrid">
      <div><h4 data-i="ku_title"></h4>
        <table class="ref"><thead><tr><th data-i="ku_use"></th><th class="num">Ku</th></tr></thead><tbody id="kuTable"></tbody></table></div>
      <div><h4 data-i="ks_title_use"></h4>
        <table class="ref"><thead><tr><th data-i="ku_use"></th><th class="num">Ks</th></tr></thead><tbody id="ksUseTable"></tbody></table></div>
      <div><h4 data-i="ks_title_n"></h4>
        <table class="ref"><thead><tr><th data-i="ks_ncirc"></th><th class="num">Ks</th></tr></thead><tbody id="ksNTable"></tbody></table></div>
    </div>
    <p class="hint" data-i="kuks_ref"></p>
  </details>
  <div class="card iso">
    <h3 data-i="loads_table"></h3>
    <div style="overflow-x:auto">
    <table id="loads">
      <thead><tr><th data-i="c_name"></th><th class="num" data-i="c_p"></th><th class="num" data-i="c_v"></th><th class="num" data-i="c_q"></th><th class="num" data-i="c_h"></th><th data-i="c_per"></th><th class="num">Ku</th><th class="num">Ks</th><th data-i="c_type"></th><th class="num" data-i="c_e"></th><th></th></tr></thead>
      <tbody></tbody>
      <tfoot><tr><td colspan="9" data-i="total"></td><td class="num" id="eTot"></td><td></td></tr></tfoot>
    </table>
    </div>
    <div class="row" style="margin-top:10px">
      <select id="preset"></select>
      <button class="btn" id="bAdd" data-i="add"></button>
      <button class="btn" id="bAddEmpty" data-i="add_empty"></button>
    </div>
    <div class="grid" style="margin-top:14px">
      <label class="f"><span data-i="eta_ond"></span><input type="number" step="0.01" min="0.5" max="1" id="etaOnd"></label>
      <label class="f"><span data-i="fc"></span><input type="number" step="0.05" min="0.1" max="1" id="simult"></label>
    </div>
    <p class="hint" data-i="loads_hint"></p>
  </div>
  <div class="card grd">
    <h3 data-i="conso_year"></h3>
    <div class="grid">
      <label class="f"><span data-i="conso_kwh"></span><input type="number" step="10" min="0" id="consoYear"></label>
      <label class="f"><span data-i="rate"></span><input type="number" step="5" min="1" max="200" id="rate"></label>
    </div>
    <p class="hint" data-i="conso_hint"></p>
  </div>
  <div class="card"><h3 data-i="results"></h3><div id="mLoads"></div><div class="res" id="rLoads"></div><div id="fLoads"></div></div>
  <div class="navbtns"><button class="btn" data-go="0" data-i="prev"></button><button class="btn primary" data-go="2" data-i="next"></button></div>
</section>

<!-- 3. PANNEAUX -->
<section class="tab" id="t-pv">
  <h2 data-i="t_pv"></h2>
  <p class="lead" data-i="pv_lead"></p>
  <div class="card">
    <h3 data-i="module"></h3>
    <div class="grid">
      <label class="f"><span data-i="model"></span><select id="modPreset"></select></label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label class="f"><span>P<sub>c</sub> (Wc)</span><input type="number" id="mP" step="5" min="1"></label>
      <label class="f"><span>V<sub>mp</sub> (V)</span><input type="number" id="mVmp" step="0.1" min="1"></label>
      <label class="f"><span>I<sub>mp</sub> (A)</span><input type="number" id="mImp" step="0.01" min="0.1"></label>
      <label class="f"><span>V<sub>oc</sub> (V)</span><input type="number" id="mVoc" step="0.1" min="1"></label>
      <label class="f"><span>I<sub>sc</sub> (A)</span><input type="number" id="mIsc" step="0.01" min="0.1"></label>
      <label class="f"><span data-i="m_area"></span><input type="number" id="mArea" step="0.01" min="0.1"></label>
      <label class="f iso"><span data-i="m_unom"></span><select id="mUnom"><option>12</option><option>24</option></select></label>
    </div>
  </div>
  <div class="card iso">
    <h3 data-i="pv_params"></h3>
    <div class="grid">
      <label class="f"><span data-i="k"></span><input type="number" id="kLoss" step="0.01" min="0.3" max="1"></label>
      <label class="f"><span data-i="usys"></span><select id="usysMode"><option value="auto" data-i="auto"></option><option value="12">12 V</option><option value="24">24 V</option><option value="48">48 V</option></select></label>
      <label class="f"><span data-i="regtype"></span><select id="regType"><option value="MPPT">MPPT</option><option value="PWM">PWM</option></select></label>
      <label class="f"><span data-i="vmax"></span><input type="number" id="regVmax" step="10" min="20"></label>
      <label class="f"><span data-i="ns_force"></span><input type="number" id="nsForce" step="1" min="0"></label>
    </div>
    <p class="hint" data-i="k_hint"></p>
  </div>
  <div class="card grd">
    <h3 data-i="pv_place"></h3>
    <div class="grid">
      <label class="f"><span data-i="orient"></span><select id="orient"></select></label>
      <label class="f"><span data-i="tilt"></span><select id="tilt"></select></label>
      <label class="f"><span data-i="pr"></span><input type="number" id="pr" step="0.01" min="0.5" max="1"></label>
    </div>
    <p class="hint" data-i="orient_hint"></p>
  </div>
  <div class="card"><h3 data-i="results"></h3><div id="mPv"></div><div class="res" id="rPv"></div><div class="cpl iso" id="cplPv"></div><div id="fPv"></div></div>
  <div class="navbtns"><button class="btn" data-go="1" data-i="prev"></button><button class="btn primary" data-go="3" data-i="next"></button></div>
</section>

<!-- 4. BATTERIES -->
<section class="tab" id="t-bat">
  <h2 data-i="t_bat"></h2>
  <p class="lead" data-i="bat_lead"></p>
  <div class="card">
    <h3 data-i="battery"></h3>
    <div class="grid">
      <label class="f"><span data-i="model"></span><select id="batPreset"></select></label>
      <label class="f"><span data-i="tech"></span><select id="batTech"><option value="pb" data-i="tech_pb"></option><option value="lfp" data-i="tech_lfp"></option></select></label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label class="f"><span data-i="b_u"></span><select id="batU"><option>2</option><option>6</option><option>12</option><option>24</option><option>48</option></select></label>
      <label class="f"><span data-i="b_c"></span><input type="number" id="batC" step="5" min="1"></label>
      <label class="f"><span data-i="b_d"></span><input type="number" id="batD" step="0.05" min="0.1" max="1"></label>
      <label class="f"><span data-i="b_days"></span><input type="number" id="batDays" step="0.5" min="0.5"></label>
      <label class="f"><span data-i="b_rate"></span><select id="batRate"><option>C10</option><option>C20</option><option>C100</option></select></label>
    </div>
    <p class="hint" data-i="bat_hint"></p>
  </div>
  <div class="card"><h3 data-i="results"></h3><div id="mBat"></div><div class="res" id="rBat"></div><div class="cpl" id="cplBat"></div><div id="fBat"></div></div>
  <div class="navbtns"><button class="btn" data-go="2" data-i="prev"></button><button class="btn primary" data-go="4" data-i="next"></button></div>
</section>

<!-- 5. REGULATEUR & ONDULEUR -->
<section class="tab" id="t-conv">
  <h2 data-i="t_conv"></h2>
  <p class="lead" data-i="conv_lead"></p>
  <div class="card">
    <div class="grid">
      <label class="f"><span data-i="reg_brand"></span><select id="regBrand"><option value="generic" data-i="generic"></option><option value="victron">Victron SmartSolar MPPT</option><option value="studer">Studer VarioTrack (MPPT)</option></select></label>
      <label class="f"><span data-i="ond_brand"></span><select id="ondBrand"><option value="generic" data-i="generic"></option><option value="victron">Victron Phoenix</option><option value="studer">Studer Xtender</option></select></label>
    </div>
    <p class="hint" data-i="brand_hint"></p>
  </div>
  <div class="card"><h3 data-i="reg"></h3><div id="mReg"></div><div class="res" id="rReg"></div><div id="fReg"></div></div>
  <div class="card"><h3 data-i="ond"></h3><div id="mOnd"></div><div class="res" id="rOnd"></div><div id="fOnd"></div></div>
  <div class="navbtns"><button class="btn" data-go="3" data-i="prev"></button><button class="btn primary" data-go="5" data-i="next"></button></div>
</section>

<!-- 6. CABLES -->
<section class="tab" id="t-cab">
  <h2 data-i="t_cab"></h2>
  <p class="lead" data-i="cab_lead"></p>
  <div class="card">
    <div style="overflow-x:auto">
    <table id="cabT">
      <thead><tr><th data-i="link"></th><th class="num" data-i="len"></th><th class="num">ΔU max (%)</th><th class="num">I (A)</th><th class="num">U (V)</th><th class="num" data-i="s_calc"></th><th class="num" data-i="s_norm"></th><th class="num" data-i="du_real"></th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
    <p class="hint" data-i="cab_hint"></p>
    <div id="fCab"></div>
  </div>
  <div class="navbtns"><button class="btn" data-go="4" data-i="prev"></button><button class="btn primary" data-go="6" data-i="next"></button></div>

const nf = (x, d=2) => { // nombre "propre" pour les formules
  if (!isFinite(x)) return "—";
  const r = Math.round(x * 10**d) / 10**d; return fixEn(r.toLocaleString(LOC(), {maximumFractionDigits:d}));
};
const nextStd = (v, list) => list.find(x => x >= v - 1e-9) ?? null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const loadName = L => L.n || (L.k ? t(L.k) : t("new_line"));

const kpi = (label, val, sub, gold) => `<div class="kpi${gold?" g":""}"><span>${label}</span><b>${U(val)}</b>${sub?`<i>${U(sub)}</i>`:""}</div>`;
const fml = (title, expr) => { let e = U(expr); if (lang==="en") e = e.replace(/(\d),(\d)/g, "$1.$2").replace(/ à /g, " – "); else if (lang==="es") e = e.replace(/ à /g, " a "); return `<div class="formula"><span class="t">${title}</span>${e}</div>`; };
const msg = (type, txt) => `<div class="msg ${type}">${String(txt).replace(/\b([IUC])_([A-Za-z]+)/g, "$1<sub>$2</sub>")}</div>`;

/* ---------- Calculs ---------- */
function compute(){
  const R = {warn:[], f:{}};
  R.ir = S.period==="year" ? S.hDec : S.period==="summer" ? S.hSum : S.hYear;
  if (S.mode === "isole"){
    let eAC=0, eDC=0, pAC=0, pDC=0;
    for (const L of S.loads){ const r = rowE(L); if (L.ty==="DC"){eDC+=r.e;pDC+=r.pt;} else {eAC+=r.e;pAC+=r.pt;} }
    R.eSum = eAC + eDC; R.eAC=eAC*S.simult; R.eDC=eDC*S.simult; R.pAC=pAC*S.simult; R.pDC=pDC;
    R.E = R.eSum * S.simult;
    R.f.e = fml(t("f_e"), S.simult===1 ? `E<sub>ch</sub> = E<sub>1</sub> + E<sub>2</sub> + … + E<sub>n</sub> = <b>${nf(R.E,0)} Wh/j</b>`
      : `E<sub>ch</sub> = (E<sub>1</sub> + E<sub>2</sub> + … + E<sub>n</sub>) × f<sub>c</sub> = ${nf(R.eSum,0)} × ${nf(S.simult)} = <b>${nf(R.E,0)} Wh/j</b>`);
    if (S.simult < 1 || S.loads.some(L => (L.ks ?? 1) < 1)) R.warn.push(["warn", t("w_ks"), "load"]);
    R.f.row = fml(t("f_row"), `E = P × Nbre × Ku × Ks × t + P<sub>veille</sub> × Nbre × (24 − t)`);
    R.f.pac = fml(t("f_pac"), `P<sub>AC</sub> = Σ(P × Nbre × Ku × Ks) × f<sub>c</sub> = ${nf(pAC,0)} × ${nf(S.simult)} = <b>${nf(R.pAC,0)} W</b>`);
    if (R.E <= 0) R.warn.push(["err", t("w_noload"), "load"]);
    // Puissance crête
    R.f.ne = fml(t("f_ne"), `E<sub>sol</sub> = 1000 × N<sub>e</sub> → N<sub>e</sub> = E<sub>sol</sub> / 1000 = ${nf(R.ir*1000,0)} / 1000 = <b>${nf(R.ir)} h</b>`);
    R.pcReq = R.E / (R.ir * S.k);
    R.f.pc = fml(t("f_pc"), `P<sub>c</sub> = E<sub>ch</sub> / (N<sub>e</sub> × η<sub>ph</sub>) = ${nf(R.E,0)} / (${nf(R.ir)} × ${nf(S.k)}) = <b>${nf(R.pcReq,0)} Wc</b>`);
    // Tension système
    if (S.usysMode==="auto") R.U = R.pcReq<=500 ? 12 : R.pcReq<=2000 ? 24 : 48; else R.U = +S.usysMode;
    R.f.u = fml(t("f_usys"), S.usysMode==="auto" ? `P<sub>c</sub> = ${nf(R.pcReq,0)} Wc → <b>${R.U} V</b> &nbsp;(≤ 500 Wc : 12 V ; ≤ 2 000 Wc : 24 V ; > 2 000 Wc : 48 V)` : `<b>${R.U} V</b>`);
    // Modules
    const P=S.mP, Vmp=S.mVmp, Voc=S.mVoc, Isc=S.mIsc;
    if (S.regType==="PWM"){
      R.ns = S.nsForce>0 ? S.nsForce : Math.max(1, Math.round(R.U / S.mUnom));
      if (R.ns*S.mUnom !== R.U) R.warn.push(["err", t("w_pwm",{a:R.ns*S.mUnom,b:R.U,c:R.U===12?"12":"24"}), "pv"]);
      R.f.ns = fml(t("f_ns"), `N<sub>s</sub> = U<sub>sys</sub> / U<sub>module</sub> = ${R.U} / ${S.mUnom} = <b>${R.ns}</b>`);
    } else {
      R.nsMin = Math.max(1, Math.ceil(1.4 * R.U / Vmp));
      R.vLim = Math.min(UOC_MAX_ISOLE, S.regBrand==="generic" ? S.regVmax : UOC_MAX_ISOLE);
      R.nsMax = Math.floor(R.vLim / (Voc * K_FROID));
      R.ns = S.nsForce>0 ? S.nsForce : R.nsMin;
      if (R.ns < R.nsMin) R.warn.push(["err", t("w_nsmin",{a:R.nsMin}), "pv"]);
      if (R.nsMin > R.nsMax) R.warn.push(["err", t("w_nsconf",{a:R.nsMin,b:R.nsMax}), "pv"]);
      R.f.ns = fml(t("f_ns"), `N<sub>s min</sub> = ⌈1,4 × U<sub>sys</sub> / V<sub>mp</sub>⌉ = ⌈1,4 × ${R.U} / ${nf(Vmp,1)}⌉ = ${R.nsMin} ; N<sub>s max</sub> = ⌊V<sub>max</sub> / (1,2 × V<sub>oc</sub>)⌋ = ⌊${R.vLim} / (1,2 × ${nf(Voc,1)})⌋ = ${R.nsMax} → <b>N<sub>s</sub> = ${R.ns}</b>`);
    }
    const n0 = Math.max(1, Math.ceil(R.pcReq / P));
    R.np = Math.max(1, Math.ceil(n0 / R.ns));
    R.n = R.ns * R.np;
    R.pcInst = R.n * P;
    R.f.n = fml(t("f_n"), `N<sub>mpv</sub> = P<sub>c</sub> / P<sub>module</sub> = ${nf(R.pcReq,0)} / ${P} = ${nf(R.pcReq/P,2)} → ${n0} → N<sub>p</sub> = ⌈${n0} / ${R.ns}⌉ = ${R.np} ${t("strings")} → <b>N = ${R.ns} × ${R.np} = ${R.n}</b> (${nf(R.pcInst,0)} Wc)`);
    R.area = R.n * S.mArea;
    R.prod = R.pcInst * R.ir * S.k;
    R.cover = R.E>0 ? R.prod / R.E : 0;
    if (R.cover > 1.5) R.warn.push(["warn", t("w_over",{a:nf(R.cover*100,0)}), "pv"]);
    R.f.prod = fml(t("f_prod"), `E<sub>prod</sub> = P<sub>c inst</sub> × N<sub>e</sub> × η<sub>ph</sub> = ${nf(R.pcInst,0)} × ${nf(R.ir)} × ${nf(S.k)} = <b>${nf(R.prod,0)} Wh/j</b> (${nf(R.cover*100,0)} %)`);
    // Voc grand froid
    R.vocCold = R.ns * Voc * K_FROID;
    if (R.vocCold > UOC_MAX_ISOLE) R.warn.push(["err", t("w_uoc",{a:nf(R.vocCold,0)}), "pv reg"]);
    else if (S.regType==="MPPT" && S.regBrand==="generic" && R.vocCold > S.regVmax) R.warn.push(["err", t("w_voc",{a:nf(R.vocCold,0),b:S.regVmax}), "pv reg"]);
    R.f.voc = fml(t("f_voc"), `U<sub>oc max</sub> = N<sub>s</sub> × V<sub>oc</sub> × 1,2 = ${R.ns} × ${nf(Voc,1)} × 1,2 = <b>${nf(R.vocCold,1)} V</b> ${R.vocCold<=UOC_MAX_ISOLE?"≤":">"} 120 V (UTE C 15-712-2)`);
    // Batteries
    R.cReq = R.E * S.days / (S.bD * R.U);
    R.f.c = fml(t("f_c"), `C = E<sub>ch</sub> × J / (U × D) = ${nf(R.E,0)} × ${nf(S.days,1)} / (${R.U} × ${nf(S.bD)}) = <b>${nf(R.cReq,0)} Ah</b>`);
    R.c50 = R.E * S.days / (R.U * 0.5);
    R.f.c50 = fml(t("c50"), `C<sub>50 %</sub> = E<sub>ch</sub> × J / (U × 0,5) = ${nf(R.E,0)} × ${nf(S.days,1)} / (${R.U} × 0,5) = <b>${nf(R.c50,0)} Ah</b>`);
    R.nbs = R.U / S.bU;
    if (!Number.isInteger(R.nbs) || R.nbs < 1){ R.warn.push(["err", t("w_bat",{a:S.bU,b:R.U}), "bat"]); R.nbs = Math.max(1, Math.round(R.nbs)); }
    R.nbp = Math.max(1, Math.ceil(R.cReq / S.bC));
    R.nb = R.nbs * R.nbp; R.cInst = R.nbp * S.bC;
    R.f.nb = fml(`${t("f_nbs")} / ${t("f_nbp")}`, `N<sub>s</sub> = U / U<sub>bat</sub> = ${R.U} / ${S.bU} = ${R.nbs} ; N<sub>p</sub> = ⌈C / C<sub>bat</sub>⌉ = ⌈${nf(R.cReq,0)} / ${S.bC}⌉ = ${R.nbp} → <b>${R.nb} ${t("b_bat").toLowerCase()}(s), ${R.cInst} Ah</b>`);
    R.eStock = R.cInst * R.U; R.eUse = R.eStock * S.bD;
    R.auto = R.E>0 ? R.eUse / R.E : 0;
    R.icc = 10 * R.cInst; R.daily = R.E / R.eStock;
    R.f.icc = fml(t("icc"), `I<sub>cc</sub> = 10 × C<sub>n</sub> = 10 × ${R.cInst} = <b>${nf(R.icc,0)} A</b>`);
    R.f.daily = fml(t("daily"), `E<sub>ch</sub> / (C<sub>inst</sub> × U) = ${nf(R.E,0)} / (${R.cInst} × ${R.U}) = <b>${nf(R.daily*100,0)} %</b>`);
    R.f.auto = fml(t("f_auto"), `N<sub>r</sub> = C<sub>inst</sub> × D × U / E<sub>ch</sub> = ${R.cInst} × ${nf(S.bD)} × ${R.U} / ${nf(R.E,0)} = <b>${nf(R.auto,1)} ${t("days")}</b>`);
    if (S.tech==="pb" && S.bD>0.8) R.warn.push(["warn", t("w_pb_d"), "bat"]);
    // Régulateur
    if (S.regType==="MPPT"){
      R.iReg = 1.25 * R.pcInst / R.U;
      R.f.ireg = fml(t("f_ireg"), `I = 1,25 × P<sub>c inst</sub> / U = 1,25 × ${nf(R.pcInst,0)} / ${R.U} = <b>${nf(R.iReg,1)} A</b>`);
    } else {
      R.iReg = 1.25 * Isc * R.np;
      R.f.ireg = fml(t("f_ireg"), `I = 1,25 × I<sub>sc</sub> × N<sub>p</sub> = 1,25 × ${nf(Isc)} × ${R.np} = <b>${nf(R.iReg,1)} A</b>`);
    }
    R.regStd = nextStd(R.iReg, REG_STD);
    R.regModel = null;
    if (S.regBrand !== "generic"){
      const B = REGS[S.regBrand]; let best = null;
      for (const m of B.models){
        const pn = m[3][R.U], vm = m[2][R.U];
        if (!pn || !vm || vm < R.vocCold) continue;
        const n = Math.ceil(R.pcInst / pn);
        if (!best || n < best.n || (n === best.n && m[1] < best.i)) best = {name:`${B.name} ${m[0]}`, n, i:m[1], p:pn, v:vm, id:`${S.regBrand}:${m[0]}`};
      }
      if (S.regForce && S.regForce.startsWith(S.regBrand + ":")){
        const m = B.models.find(m => `${S.regBrand}:${m[0]}` === S.regForce);
        const pn = m && m[3][R.U], vm = m && m[2][R.U];
        if (m && pn && vm && vm >= R.vocCold) best = {name:`${B.name} ${m[0]}`, n:Math.ceil(R.pcInst / pn), i:m[1], p:pn, v:vm, id:S.regForce, forced:true};
        else R.warn.push(["warn", t("w_force_nok",{a:S.regForce.split(":")[1]}), "reg"]);
      }
      R.regModel = best;
      if (best) R.f.regsel = fml(t("f_regsel"), `N<sub>rég</sub> = ⌈P<sub>c inst</sub> / P<sub>PV nom</sub>(${R.U} V)⌉ = ⌈${nf(R.pcInst,0)} / ${best.p}⌉ = <b>${best.n} × ${best.name}</b> (${best.i} A, U<sub>PV max</sub> ${best.v} V ≥ ${nf(R.vocCold,0)} V)`);
      else R.warn.push(["err", t("w_noreg",{a:nf(R.vocCold,0),b:B.name}), "reg"]);
      if (best && best.n > 1) R.warn.push(["warn", t("w_multi",{n:best.n}), "reg"]);
    } else if (!R.regStd || R.iReg > 100) R.warn.push(["warn", t("w_reg_big"), "reg"]);
    // Onduleur
    if (R.pAC > 0){
      R.pOndReq = 1.25 * R.pAC; R.ondStd = nextStd(R.pOndReq, OND_STD) || Math.ceil(R.pOndReq/1000)*1000;
      R.ondModel = null;
      if (S.ondBrand !== "generic"){
        const B = INVS[S.ondBrand];
        let m = B.models.find(m => m[3].includes(R.U) && m[1] >= R.pOndReq);
        if (S.ondForce && S.ondForce.startsWith(S.ondBrand + ":")){
          const f = B.models.find(x => `${S.ondBrand}:${x[0]}` === S.ondForce);
          if (f && f[3].includes(R.U) && f[1] >= R.pOndReq) m = f;
          else R.warn.push(["warn", t("w_force_nok",{a:S.ondForce.split(":")[1].replace("{U}",R.U)}), "ond"]);
        }
        if (m){ R.ondModel = {name:m[0].replace("{U}", R.U), p:m[1], pk:m[2], u:m[4], id:`${S.ondBrand}:${m[0]}`}; R.ondStd = m[1];
          R.f.ondsel = fml(t("f_ondsel"), `P<sub>cont</sub> ≥ 1,25 × P<sub>AC</sub> = ${nf(R.pOndReq,0)} → <b>${R.ondModel.name}</b> : ${m[1]} ${m[4]} (${t("peak")} ${m[2]} ${m[4]==="VA"?"VA":"W"})`); }
        else R.warn.push(["err", t("w_noond",{a:B.name, u:R.U}), "ond"]);
      }
      R.iDC = R.ondStd / (R.U * S.eta);
      R.f.pond = fml(t("f_pond"), `P<sub>ond</sub> = 1,25 × P<sub>AC</sub> = 1,25 × ${nf(R.pAC,0)} = <b>${nf(R.pOndReq,0)} VA</b>${R.ondModel?"":` → ${R.ondStd} VA`}`);
      R.f.idc = fml(t("f_idc"), `I<sub>DC</sub> = P<sub>ond</sub> / (U × η) = ${R.ondStd} / (${R.U} × ${nf(S.eta)}) = <b>${nf(R.iDC,1)} A</b>`);
      if (S.loads.some(L => ["a_pump","a_fridge","a_freezer","a_wash"].includes(L.k) && L.ty==="AC")) R.warn.push(["warn", t("w_ond"), "ond"]);
    } else { R.pOndReq=0; R.ondStd=0; R.iDC=0; }
    // Câbles
    const C = S.cab;
    R.cables = [
      cable("l_pv", C.l1, C.d1, 1.25*Isc*R.np, R.ns*Vmp, "1"),
      cable("l_bat", C.l2, C.d2, R.iReg, R.U, "2"),
    ];
    if (R.ondStd) R.cables.push(cable("l_ond", C.l3, C.d3, R.iDC, R.U, "3"));
    R.prot = protections(R);
    for (const w of R.prot.warn) R.warn.push([w[0], w[1], "prot"]);
  } else {
    // Raccordé réseau
    R.hY = S.hYear * 365;
    R.fo = ORIENT_F[S.orient][TILTS.indexOf(+S.tilt)];
    R.eTarget = S.consoYear * S.rate / 100;
    R.f.et = fml(t("f_etarget"), `E = C<sub>an</sub> × τ = ${nf(S.consoYear,0)} × ${nf(S.rate,0)} % = <b>${nf(R.eTarget,0)} kWh/an</b>`);
    R.f.fo = fml(t("f_orient"), `${t("or_"+S.orient)}, ${S.tilt}° → <b>f = ${nf(R.fo)}</b>`);
    R.pcReq = R.eTarget / (R.hY * S.pr * R.fo) * 1000;
    R.f.pc = fml(t("f_pc"), `P<sub>c</sub> = E / (H<sub>an</sub> × PR × f) = ${nf(R.eTarget,0)} / (${nf(R.hY,0)} × ${nf(S.pr)} × ${nf(R.fo)}) = <b>${nf(R.pcReq/1000,2)} kWc</b>`);
    R.n = Math.max(1, Math.ceil(R.pcReq / S.mP)); R.pcInst = R.n * S.mP; R.area = R.n * S.mArea;
    R.f.n = fml(t("f_n"), `N = ⌈P<sub>c</sub> / P<sub>module</sub>⌉ = ⌈${nf(R.pcReq,0)} / ${S.mP}⌉ = <b>${R.n}</b> (${nf(R.pcInst/1000,2)} kWc)`);
    R.prodY = R.pcInst/1000 * R.hY * S.pr * R.fo;
    R.cover = S.consoYear>0 ? R.prodY / S.consoYear : 0;
    R.f.prod = fml(t("f_prod"), `E<sub>prod</sub> = P<sub>c inst</sub> × H<sub>an</sub> × PR × f = ${nf(R.pcInst/1000,2)} × ${nf(R.hY,0)} × ${nf(S.pr)} × ${nf(R.fo)} = <b>${nf(R.prodY,0)} kWh/an</b> (${nf(R.cover*100,0)} %)`);
    R.ondMin = 0.8 * R.pcInst; R.ondMax = 1.0 * R.pcInst;
    const OG=[600,800,1000,1200,1500,2000,2500,3000,3600,4000,4600,5000,6000,8000,10000,12000];
    const inRange = OG.filter(x => x >= R.ondMin-1e-9 && x <= R.ondMax+1e-9);
    R.ondStd = inRange.length ? inRange[inRange.length-1] : (nextStd(R.ondMin, OG) || Math.ceil(R.ondMin/1000)*1000);
    R.f.pond = fml(t("f_pond"), `P<sub>ond</sub> ≈ 0,8 à 1 × P<sub>c</sub> = ${nf(R.ondMin,0)} à ${nf(R.ondMax,0)} W → <b>${R.ondStd} W</b>`);
    R.cables = [cable("l_inv", S.cab.lg, S.cab.dg, 1.25*S.mIsc, Math.min(R.n, Math.floor(600/(S.mVoc*1.15))||1)*S.mVmp, "g")];
  }
  return R;
}
function cable(key, L, du, I, U, id){
  const s = U>0 ? RHO * 2 * L * I / (du/100 * U) : 0;
  const std = nextStd(Math.max(s, key==="l_pv"||key==="l_inv" ? 4 : 1.5), SEC_STD) || SEC_STD[SEC_STD.length-1];
  const real = U>0 ? RHO * 2 * L * I / std / U * 100 : 0;
  const f = fml(`${t("f_s")} — ${t(key)}`, `S = ρ × 2L × I / (ΔU × U) = 0,023 × 2 × ${nf(L,1)} × ${nf(I,1)} / (${nf(du/100,3)} × ${nf(U,1)}) = ${nf(s,2)} mm² → <b>${String(std).replace(".",lang==="en"?".":",")} mm²</b>`);
  return {key, L, du, I, U, s, std, real, f, id};
}

function rowE(L){
  const hj = L.per==="S" ? L.h/7 : L.h;
  const pt = L.p * L.q * (L.ku ?? 1) * (L.ks ?? 1);
  const e = pt * hj + (L.v || 0) * L.q * Math.max(0, 24 - hj);
  return {hj, pt, e};
}

                        : [t("b_reg"), `${S.regType} ${R.regStd||">200"} A — ${R.U} V${S.regType==="MPPT"?` — PV ≥ ${num(R.vocCold)} V`:""}`, R.regStd?1:"?"]);
    if (R.ondStd) bom.push(R.ondModel ? [t("b_ond"), `${R.ondModel.name} — ${R.ondModel.p} ${R.ondModel.u} — 230 V ~ ${t("sine")}`, 1]

    $("loadsPrint").querySelector("tbody").innerHTML = S.loads.map(L => `<tr><td>${esc(loadName(L))}</td><td class="num">${num(L.p)}</td><td class="num">${num(L.v||0)}</td><td class="num">${L.q}</td><td class="num">${nf(L.h)}</td><td>${L.per==="S"?t("per_S"):t("per_J")}</td><td class="num">${nf(L.ku??1)}</td><td class="num">${nf(L.ks??1)}</td><td>${L.ty}</td><td class="num">${num(rowE(L).e)}</td></tr>`).join("")
      + `<tr><td colspan="9"><b>${t("total")}</b></td><td class="num"><b>${num(R.eSum)}</b></td></tr>`
      + (S.simult!==1 ? `<tr><td colspan="9"><b>E<sub>ch</sub> (× f<sub>c</sub> = ${nf(S.simult)})</b></td><td class="num"><b>${num(R.E)}</b></td></tr>` : "");
    $("cplSum1").innerHTML = coupling(R, "pv"); $("cplSum2").innerHTML = coupling(R, "bat");
    $("fAll").innerHTML = R.f.row + R.f.e + R.f.pac + R.f.ne + R.f.pc + R.f.u + R.f.ns + R.f.n + R.f.prod + R.f.voc + R.f.c + R.f.c50 + R.f.nb + R.f.auto + R.f.icc + R.f.ireg + (R.f.pond||"") + (R.f.idc||"") + R.cables.map(c=>c.f).join("");
  } else {

      + kpi(t("surface"), `${num(R.area,1)} m²`) + kpi(t("prod_year"), `${num(R.prodY)} kWh/an`, `${t("cover")} : ${num(R.cover*100)} %`, true) + kpi(t("b_ond_grid"), `${R.ondStd} W`);

  }
  if (R.prot) for (const it of R.prot.items) if (it.id !== "PE") bom.push([`${it.id} — ${it.title}`, it.ref.replace(/<[^>]+>/g,""), it.qty]);
  if (R.prot && R.prot.items.length) bom.push([t("p_earth"), t("earth_bom"), "1"]);
  for (const c of R.cables) bom.push([`${t("f_s")} — ${t(c.key)}`, `${String(c.std).replace(".",lang==="en"?".":",")} mm² — 2 × ${nf(c.L,1)} m`, `${nf(2*c.L,1)} m`]);
  $("bom").querySelector("tbody").innerHTML = bom.map(b => `<tr><td>${b[0]}</td><td>${U(b[1])}</td><td class="num">${b[2]}</td></tr>`).join("");
  $("synop").innerHTML = synoptic(R);
}

function renderDoc(R){
  const lnk = (u, l) => u ? `<a href="${u}" target="_blank" rel="noopener">${l||t("datasheet")} ↗</a>` : "";
  const tbl = (head, rows) => `<div class="scroll"><table><thead><tr>${head.map((h,i)=>`<th${i>0&&i<head.length-1?' class="num"':""}>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  let h = "";
  // --- Modules ---
  const modRow = (id, name, P, Vmp, Imp, Voc, Isc, A, doc) => `<tr class="pick${S.mod===id?" sel":""}" data-pick="mod:${id}"><td>${name}</td><td class="num">${P}</td><td class="num">${nf(Vmp,2)}</td><td class="num">${nf(Imp,2)}</td><td class="num">${nf(Voc,2)}</td><td class="num">${nf(Isc,2)}</td><td class="num">${nf(A,2)}</td><td>${lnk(doc)}</td></tr>`;

  for (const [g, list] of MOD_BRANDS){
    mr += `<tr><td colspan="8" style="background:var(--celeste-l);font-weight:700">${g}</td></tr>`;
    mr += list.map(m => modRow(m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7], m[0]==="ds425"?DOC.ds425 : m[0]==="ds500"?DOC.ds500 : DOC.jinko)).join("");
  }
  mr += `<tr><td colspan="8" style="background:var(--celeste-l);font-weight:700">${t("g_generic")} / ${t("g_td")}</td></tr>`;
  mr += MODULES.filter(m => m[0]!=="mcustom").map(m => modRow(m[0], m[1], m[2], m[3], m[4], m[5], m[6], m[7], "")).join("");
  mr += Object.entries(MOD_TD).map(([k,m]) => modRow(k, m[0], m[1], m[2], m[3], m[4], m[5], m[6], "")).join("");
  h += `<div class="card doc"><h3>${t("doc_pv")}</h3>${tbl([t("model"),"P<sub>c</sub> (Wc)","V<sub>mp</sub> (V)","I<sub>mp</sub> (A)","V<sub>oc</sub> (V)","I<sub>sc</sub> (A)","m²",""], mr)}</div>`;
  if (S.mode === "isole"){

      rr += B.models.map(m => {
        const pn = m[3][R.U], vm = m[2][R.U], ok = pn && vm && vm >= R.vocCold;

        return `<tr class="pick${sel?" sel":""}${ok?"":" nok"}" data-pick="reg:${b}:${m[0]}" title="${ok?"":t("doc_nok")}"><td>${B.name.split(" ")[0]} ${m[0]}</td><td class="num">${m[1]}</td><td class="num">${[12,24,48].map(u=>m[2][u]||"—").join(" / ")}</td><td class="num">${[12,24,48].map(u=>m[3][u]||"—").join(" / ")}</td><td class="num">${pn||"—"}</td><td class="num">${n?`${n}`:"✗"}</td><td>${lnk(regDoc(b,m[0]))}</td></tr>`;
      }).join("");
    }
    h += `<div class="card doc"><h3>${t("doc_reg")} — ${t("doc_for")} ${R.U} V, P<sub>c</sub> = ${num(R.pcInst)} Wc, U<sub>oc max</sub> = ${num(R.vocCold)} V</h3>${tbl([t("model"),"I<sub>max</sub> (A)","U<sub>PV max</sub> 12/24/48 V","P<sub>PV</sub> 12/24/48 V (W)",`P<sub>PV</sub> ${R.U} V`,t("doc_n"),""], rr)}</div>`;
    // --- Onduleurs ---
    let ir = "";
    for (const b of ["victron","studer"]){
      const B = INVS[b];
      ir += `<tr><td colspan="6" style="background:var(--celeste-l);font-weight:700">${B.name}</td></tr>`;
      ir += B.models.map(m => {
        const ok = m[3].includes(R.U) && m[1] >= (R.pOndReq||0);
        const sel = R.ondModel && R.ondModel.id === `${b}:${m[0]}` && S.ondBrand === b;
        return `<tr class="pick${sel?" sel":""}${ok?"":" nok"}" data-pick="ond:${b}:${m[0]}" title="${ok?"":t("doc_nok")}"><td>${m[0].replace("{U}", m[3].includes(R.U)?R.U:m[3][0])}</td><td class="num">${m[1]} ${m[4]}</td><td class="num">${m[2]} ${m[4]}</td><td class="num">${m[3].join(" / ")}</td><td class="num">${ok?"✔":"✗"}</td><td>${lnk(invDoc(b,m[0]))}</td></tr>`;
      }).join("");
    }
    h += `<div class="card doc"><h3>${t("doc_ond")} — ${t("doc_need")} ${num(R.pOndReq||0)} VA ${t("doc_at")} ${R.U} V</h3>${tbl([t("model"),t("doc_pcont"),t("doc_peak"),"U (V)",t("doc_ok"),""], ir)}</div>`;
    // --- Batteries ---
    const br = BATTS.filter(b => b[0]!=="bcustom").map(b => `<tr class="pick${S.bat===b[0]?" sel":""}" data-pick="bat:${b[0]}"><td>${b[1]}</td><td class="num">${t(b[2]==="pb"?"tech_pb":"tech_lfp")}</td><td class="num">${b[3]}</td><td class="num">${b[4]}</td><td class="num">${b[3]*b[4]/1000} kWh</td><td></td></tr>`).join("");
    h += `<div class="card doc"><h3>${t("doc_bat")}</h3>${tbl([t("model"),t("tech"),"U (V)","C (Ah)",t("e_stock"),""], br)}</div>`;
    // --- Protections ---
    const used = R.prot ? R.prot.items.map(i => i.ref).join(" ") : "";
    const pr = ["legrand","schneider","abb"].map(b => `<tr><td colspan="5" style="background:var(--celeste-l);font-weight:700">${b==="legrand"?"Legrand":b==="schneider"?"Schneider Electric":"ABB"}</td></tr>` +
      PROT_CAT.filter(p => p[0]===b).map(p => {
        const sel = p[3] !== "Vistop" && used.includes(p[3]);
        return `<tr class="pick${sel?" sel":""}" data-pick="${b==="abb"?"dcb:abb":"prot:"+b}"><td>${p[1]}</td><td>${p[2]}</td><td class="num"><span class="ref">${p[3]}</span></td><td></td><td>${lnk(DOC[p[4]])}</td></tr>`;
      }).join("")).join("");
    h += `<div class="card doc"><h3>${t("t_prot")}</h3>${tbl([t("item"),t("spec"),t("doc_ref"),"",""], pr)}<p class="hint">${t("doc_prot_hint")} ${lnk(DOC.legGuide, "Legrand — guide PV")} · ${lnk(DOC.wiring, "Victron — Wiring Unlimited § 7")}</p></div>`;
  }
  $("docBody").innerHTML = h;
}

/* ---------- Protections (UTE C 15-712-2, NF C 15-100) ---------- */
function protections(R){
  const P = {items:[], warn:[]};
  if (S.mode !== "isole") return P;
  const Isc = S.mIsc, Voc = S.mVoc, leg = S.protBrand === "legrand";
  const add = (o) => P.items.push(o);
  // 1. Coupe-circuits de chaîne (obligatoires ici : sectionnement + protection, sur les 2 polarités)
  const fMin = 1.5 * Isc, fMax = Math.min(2 * Isc, S.mIrm);
  const fCal = FUSE_PV.find(x => x >= fMin) || null;
  P.fuse = fCal; P.fuseOk = fCal && fCal <= fMax;
  const ueStr = K_FROID * Voc * R.ns;
  let refF;
  const nF = S.dcEarth === "neg" ? 1 : 2; // − relié à la terre : fusible sur le + seul, le − est seulement coupé
  if (leg) refF = (fCal && fCal <= 20) ? `${t("leg_cc")} 2P 20 A 1000 V⎓ <span class="ref">4 146 82</span> + ${nF} × ${t("cart_gpv")} ${fCal} A <span class="ref">${LEG_GPV[fCal]||"—"}</span>` : null;
  else refF = fCal ? `${t("sch_cc")} <span class="ref">DF101PV</span> × 2 (1P 32 A 1000 V⎓) + ${nF} × ${t("cart_gpv")} ${fCal} A` : null;
  if (leg && fCal && fCal > 20) P.warn.push(["err", t("w_leg20",{a:nf(fMin,1)})]);
  if (!P.fuseOk) P.warn.push(["err", t("w_fuse",{a:nf(fMin,1),b:nf(fMax,1)})]);
  add({id:"Q1", tag:"ob", title:t("p_cc"), qty:`${R.np} × 2P`,
    rule:`1,5 × I<sub>sc</sub> ≤ I<sub>n</sub> ≤ min(2 × I<sub>sc</sub> ; I<sub>RM</sub>) → ${nf(fMin,1)} ≤ I<sub>n</sub> ≤ ${nf(fMax,1)} A → <b>${fCal||"—"} A gPV</b> ; U<sub>e</sub> ≥ 1,2 × U<sub>oc</sub> × N<sub>s</sub> = ${nf(ueStr,0)} V`,
    ref: refF || `<i>${t("no_ref")}</i>`, note:t(S.dcEarth==="neg"?"p_cc_note_neg":"p_cc_note")});
  // 2. Sectionneur / disjoncteur général DC côté panneaux
  const nGrp = R.regModel ? R.regModel.n : 1, nch = Math.ceil(R.np / nGrp);
  const iSec = 1.25 * Isc * nch, cSec = MCB_STD.find(x => x >= iSec) || null;
  let refQ2;
  if (!cSec) refQ2 = t("p_sec_big",{a:Math.ceil(iSec)});
  else if (S.dcbBrand === "abb") refQ2 = `ABB S800PV-S 2P ${cSec||"> 63"} A (800 V⎓)${cSec===63?` <span class="ref">2CCF019605R0001</span>`:""}`;
  else { const c = [8,10,16,20].find(x => x >= iSec); refQ2 = c ? `Schneider C60PV-DC 2P ${c} A 800 V⎓ <span class="ref">${SCH_C60PV[c]}</span>` : `Schneider C60PV-DC 2P ${cSec||"> 63"} A 800 V⎓ (${t("range_63")})`; }
  add({id:"Q2", tag:"ob", title:t("p_sec"), qty:`${nGrp} × 2P`,
    rule:`${nGrp>1?`${t("per_group",{n:nGrp,c:nch})} — `:""}I<sub>n</sub> ≥ 1,25 × I<sub>sc</sub> × N<sub>ch</sub> = 1,25 × ${nf(Isc)} × ${nch} = <b>${nf(iSec,1)} A</b> → ${cSec||"> 63"} A ; U<sub>e</sub> ≥ 1,2 × U<sub>oc</sub> × N<sub>s</sub> = ${nf(ueStr,0)} V`,
    ref: refQ2, note:t("p_sec_note")});
  // 3. Protection côté batterie (régulateur → batterie et batterie → onduleur)
  const kIcc = S.tech === "lfp" ? 25 : 10;
  P.icc = kIcc * R.cInst;
  const batLine = (id, title, I) => {
    const In = 1.25 * I, c = MCB_STD.find(x => x >= In);
    let ref;
    if (c && P.icc <= 10000){
      if (S.dcbBrand === "abb") ref = `ABB S200 M UC 2P ${c} A (440 V⎓, 10 kA)${c===63?` <span class="ref">2CDS272061R0634</span>`:""}`;
      else ref = `Schneider C60H-DC 2P ${c} A${c===10?` <span class="ref">A9N61528</span>`:""} ${t("or_2x1p")}`;
    } else ref = t("p_bat_big",{a:Math.ceil(In)});
    add({id, tag:"ob", title, qty:"1 × 2P",
      rule:`I<sub>n</sub> ≥ 1,25 × I = 1,25 × ${nf(I,1)} = <b>${nf(In,1)} A</b> → ${c||"> 63"} A ; ${t("pdc")} ≥ I<sub>cc batt</sub> ≈ ${kIcc} × C = ${kIcc} × ${R.cInst} = <b>${num(P.icc)} A</b>`,
      ref, note: t("p_bat_note")});
  };
  batLine("F3", t("p_bat_reg"), R.iReg);
  if (R.ondStd) batLine("Q4", t("p_bat_ond"), R.iDC);
  // 4. Parafoudre DC
  const kL = {hab:115, ter:200, sol:450}[S.bldg];
  P.lcrit = S.ng > 0 ? kL / S.ng : Infinity;
  const L = S.cab.l1;
  const dcOb = S.lightning == 1 || L >= P.lcrit;
  add({id:"F5", tag: dcOb ? "ob" : "rec", title:t("p_spd_dc"), qty:"1 × 2P",
    rule:`L<sub>crit</sub> = ${kL} / N<sub>g</sub> = ${kL} / ${nf(S.ng,1)} = <b>${nf(P.lcrit,0)} m</b> ; L = ${nf(L,1)} m ${L>=P.lcrit?"≥":"<"} L<sub>crit</sub>${S.lightning==1?` ; ${t("with_rod")}`:""} — U<sub>cpv</sub> ≥ U<sub>oc max</sub> = ${nf(R.vocCold,0)} V ; I<sub>n</sub> ≥ 5 kA ; U<sub>p</sub> ≤ 0,8 × U<sub>w</sub>`,
    ref: leg ? `Legrand ${t("spd_t2")} 600 V⎓ <span class="ref">4 141 55</span>` : `Schneider iPRD-DC 40r 800PV ${t("spd_t2")} <span class="ref">A9L40271</span>`,
    note:t("p_spd_dc_note")});
  // 5. Protection différentielle 30 mA type A (sortie onduleur)
  if (R.ondStd){
    const iAC = (R.ondModel ? R.ondModel.p : R.ondStd) / 230;
    const c = MCB_STD.find(x => x >= Math.max(iAC, 10)) || 63;
    P.rcd = c;
    add({id:"Q6", tag:"ob", title:t("p_rcd"), qty:"1 × 1P+N",
      rule:`I<sub>AC</sub> = P<sub>ond</sub> / 230 = ${nf(iAC,1)} A → <b>${c} A</b> ; I<sub>Δn</sub> = 30 mA ; ${t("rcd_typeA")}`,
      ref: leg ? `Legrand DX³ ${t("dd_name")} 1P+N ${c} A 30 mA type A` : `Schneider Acti9 iDT40 Vigi ${t("dd_name")} 1P+N ${c} A 30 mA type A — ${t("or_id")} Resi9 type A 30 mA <span class="ref">${c<=25?"R9R22225":"R9PRA263"}</span>`,
      note:t("p_rcd_note")});
    // 6. Parafoudre AC
    add({id:"F7", tag: S.lightning==1 ? "ob" : "rec", title:t("p_spd_ac"), qty:"1 × 1P+N",
      rule: S.lightning==1 ? t("spd_ac_rod") : `${t("spd_t2")} : I<sub>n</sub> ≥ 5 kA ; U<sub>c</sub> ≥ 1,1 × 230 V`,
      ref: S.lightning==1 ? (leg ? `Legrand T1+T2 1P+N <span class="ref">4 122 74</span>` : `Schneider ${t("spd_t1")}`)
                          : (leg ? `Legrand T2 1P+N In 5 kA Up 1,2 kV <span class="ref">4 122 24</span>` : `Schneider iPRD20r 1P+N T2 <span class="ref">A9L20501</span>`),
      note:t("p_spd_ac_note")});
  }
  // 7. Mise à la terre
  add({id:"PE", tag:"ob", title:t("p_earth"), qty:"",
    rule:t("earth_rule"), ref:t("earth_ref"), note:t("earth_note")});
  // Liaison du négatif batterie à la terre (Victron « Wiring Unlimited » § 7.7) ou continu flottant
  const sBat = Math.max(...R.cables.filter(c => c.key==="l_bat" || c.key==="l_ond").map(c => c.std), 0);
  P.sBatEarth = sBat;
  if (S.dcEarth === "neg"){
    add({id:"PE-", tag:"ob", title:t("p_negearth"), qty:"1",
      rule:t("negearth_rule",{s:String(sBat).replace(".",",")}), ref:t("negearth_ref"), note:t("negearth_note")});
    if (S.regBrand !== "studer") P.warn.push(["warn", t("w_pvneg")]);
  } else {
    add({id:"DC", tag:"ok", title:t("p_float"), qty:"", rule:t("float_rule"), ref:"—", note:t("float_note")});
  }
  return P;
}

/* ---------- Schéma de protection (unifilaire simplifié, avec mise à la terre) ---------- */
function schemaProt(R, P){
  if (S.mode !== "isole") return "";
  const PLUS="#c62828", MINUS="#1f2933", LN="#8b4513", NN="#1e66d0", G="#2e9e4f", Y="#f2c200";
  const ln = (x1,y1,x2,y2,c,w=2.4) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
  const pl = (pts,c,w=2.4) => `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`;
  const pe = (pts) => `<polyline points="${pts}" fill="none" stroke="${G}" stroke-width="3"/><polyline points="${pts}" fill="none" stroke="${Y}" stroke-width="3" stroke-dasharray="6 6"/>`;
  const txt = (x,y,s,o={}) => `<text x="${x}" y="${y}" font-size="${o.fs||12}" ${o.a?`text-anchor="${o.a}"`:""} font-weight="${o.b?700:400}" fill="${o.c||"#1f2933"}">${esc(U(s))}</text>`;
  const dot = (x,y,c) => `<circle cx="${x}" cy="${y}" r="3.2" fill="${c}"/>`;
  // pôle de coupe-circuit : lame inclinée vers la gauche, fusible dessiné sur la lame
  // pôle de coupe-circuit (de y à y+60) : lame inclinée vers la gauche, fusible dessiné sur la lame (fuse=false : pôle sectionné seul)
  const ccPole = (x,y,c,fuse=true) => {
    const bx=x, by=y+46, tx=x-16, ty=y+14;
    const mx=(bx+tx)/2, my=(by+ty)/2, ang=Math.atan2(ty-by, tx-bx)*180/Math.PI;
    return ln(x,y,x,y+14,c)+ln(x-5,y+14,x+5,y+14,c,2)+ln(bx,by,tx,ty,c)+ln(x,y+46,x,y+60,c)
      +(fuse?`<rect x="${mx-12}" y="${my-4.5}" width="24" height="9" fill="#fff" stroke="${c}" stroke-width="2" transform="rotate(${ang} ${mx} ${my})"/>`:"");
  };
  // pôle de disjoncteur (de y à y+60) : croix sur la borne, lame inclinée ; pôle protégé = déclencheur en double boucle sous la lame
  const cbPole = (x,y,c,prot=true) => {
    let s = ln(x,y,x,y+14,c)+ln(x-5,y+9,x+5,y+19,c,2)+ln(x-5,y+19,x+5,y+9,c,2)+ln(x,y+40,x-16,y+12,c);
    // pôle protégé : thermique = carré non fermé (créneau ⊐), puis magnétique = bosse (demi-cercle ⊃)
    s += prot ? `<path d="M${x},${y+40} h8 v9 h-8 a4.5,4.5 0 0 1 0,9" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="miter"/>`+ln(x,y+58,x,y+60,c)
              : ln(x,y+40,x,y+60,c);
    return s;
  };
  const link = (x1,x2,y) => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#555" stroke-width="1.3" stroke-dasharray="4 3"/>`;
  const spd = (x,y) => `<rect x="${x-9}" y="${y}" width="18" height="34" fill="#fff" stroke="#33414e" stroke-width="2"/><polyline points="${x-7},${y+28} ${x+6},${y+8} ${x+9},${y+8}" fill="none" stroke="#33414e" stroke-width="1.6"/>`;
  const earth = (x,y) => ln(x,y,x,y+14,G,3)+ln(x-14,y+14,x+14,y+14,G,3)+ln(x-9,y+20,x+9,y+20,G,3)+ln(x-4,y+26,x+4,y+26,G,3);
  const boxR = (x,y,w,h,l1,l2,inner="") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#fff" stroke="#33414e" stroke-width="2"/>${inner}${txt(x+w/2,y+h/2-2,l1,{a:"middle",b:1})}${l2?txt(x+w/2,y+h/2+14,l2,{a:"middle",fs:11,c:"#5f6b76"}):""}`;
  const masse = (x,y) => ln(x,y,x,y+8,G,3)+[0,1,2].map(i=>ln(x-10+i*7,y+8,x-15+i*7,y+15,G,2)).join("")+ln(x-12,y+8,x+8,y+8,G,3);
  const YPE = 625;
  let s = "";
  // ===== Générateur PV =====
  const xm = 130, xp = 190;
  s += boxR(80,24,160,62, t("sy_pv"), `${R.ns}S × ${R.np}P — ${num(R.pcInst)} Wc`);
  s += ln(xm,86,xm,120,MINUS)+ln(xp,86,xp,120,PLUS);
  s += txt(xm-6,112,"−",{a:"end",b:1,c:MINUS})+txt(xp+6,112,"+",{b:1,c:PLUS});
  // Q1 coupe-circuits (2 pôles)
  const negE = S.dcEarth === "neg";
  s += ccPole(xm,120,MINUS,!negE)+ccPole(xp,120,PLUS)+link(xm-8,xp-8,150);
  s += txt(xp+26,146,"Q1",{b:1})+txt(xp+26,161,`${R.np} × 2P gPV ${P.fuse||"?"} A`,{fs:11});
  // dérivation parafoudre DC F5
  s += ln(xm,180,xm,250,MINUS)+ln(xp,180,xp,250,PLUS);
  s += dot(xm,214,MINUS)+dot(xp,200,PLUS)+pl(`${xm},214 340,214 340,226`,MINUS,1.8)+pl(`${xp},200 370,200 370,226`,PLUS,1.8);
  s += spd(340,226)+spd(370,226)+txt(392,240,"F5",{b:1})+txt(392,255,t("sy_spd_dc"),{fs:11});
  s += pe(`340,260 340,276 370,276 370,260`)+pe(`355,276 355,${YPE}`);
  // Q2 disjoncteur / sectionneur général DC
  s += cbPole(xm,250,MINUS,!negE)+cbPole(xp,250,PLUS)+link(xm-8,xp-8,276);
  s += txt(xp+44,276,"Q2",{b:1})+txt(xp+44,291,`2P ${MCB_STD.find(x=>x>=1.25*S.mIsc*R.np)||">63"} A`,{fs:11});
  // Régulateur
  s += ln(xm,310,xm,340,MINUS)+ln(xp,310,xp,340,PLUS);
  s += boxR(80,340,160,60, t("sy_reg"), R.regModel ? `${R.regModel.n} × ${R.regModel.name.replace("SmartSolar ","")}` : `${S.regType} ${R.regStd||""} A`,
    ln(84,396,236,344,"#33414e",1.2)+txt(96,362,"=",{b:1,fs:16})+txt(226,394,"=",{a:"end",b:1,fs:16}));
  // ===== Bus batterie =====
  const xbm = 150, xbp = 175, yBus = 490;
  s += ln(xbm,400,xbm,404,MINUS)+ln(xbm,464,xbm,yBus,MINUS)+ln(xbp,400,xbp,404,PLUS);
  // F3 protection régulateur → batterie (sur le +)
  s += cbPole(xbm,404,MINUS,false)+cbPole(xbp,404,PLUS)+link(xbm-8,xbp-8,430); s += txt(xbp+44,424,"F3",{b:1})+txt(xbp+44,439,`${MCB_STD.find(x=>x>=1.25*R.iReg)||">63"} A ⎓`,{fs:11});
  s += pl(`${xbm},${yBus} 640,${yBus}`,MINUS)+pl(`${xbp},${yBus-18} ${R.ondStd?665:455},${yBus-18}`,PLUS);
  s += ln(xbp,464,xbp,yBus-18,PLUS);
  // Batteries
  s += dot(430,yBus,MINUS)+dot(455,yBus-18,PLUS)+ln(430,yBus,430,528,MINUS)+ln(455,yBus-18,455,528,PLUS);
  s += boxR(380,528,130,58, t("sy_bat"), `${R.U} V — ${num(R.cInst)} Ah`);
  // ===== Onduleur =====
  let xAC = null;
  if (R.ondStd){
    const xom = 640, xop = 665;
    s += ln(xom,yBus,xom,420,MINUS)+ln(xom,360,xom,330,MINUS)+ln(xop,yBus-18,xop,420,PLUS)+ln(xop,360,xop,330,PLUS);
    s += cbPole(xom,360,MINUS,false)+cbPole(xop,360,PLUS)+link(xom-8,xop-8,386); s += txt(xop+44,384,"Q4",{b:1})+txt(xop+44,399,`${MCB_STD.find(x=>x>=1.25*R.iDC)||">63"} A ⎓`,{fs:11});
    s += boxR(600,270,110,60, t("sy_ond"), R.ondModel ? R.ondModel.name.replace("Xtender ","").replace("Phoenix ","") : `${R.ondStd} VA`,
      ln(604,326,706,274,"#33414e",1.2)+txt(612,290,"=",{b:1,fs:16})+txt(700,322,"~",{a:"end",b:1,fs:16}));
    // Sortie AC : neutre à gauche, phase à droite
    const xn = 860, xl = 900;
    s += pl(`710,290 ${xn},290 ${xn},320`,NN)+pl(`710,305 ${xl},305 ${xl},320`,LN);
    s += txt(xn-6,316,"N",{a:"end",b:1,c:NN})+txt(xl+6,316,"L",{b:1,c:LN});
    // F7 parafoudre AC
    s += dot(xn,340,NN)+dot(xl,352,LN)+pl(`${xn},340 960,340 960,370`,NN,1.8)+pl(`${xl},352 990,352 990,370`,LN,1.8);
    s += spd(960,370)+spd(990,370)+txt(1010,384,"F7",{b:1})+txt(1010,399,t("sy_spd_ac"),{fs:11});
    s += pe(`960,404 960,420 990,420 990,404`)+pe(`975,420 975,${YPE}`);
    // Q6 disjoncteur différentiel 30 mA type A
    s += ln(xn,320,xn,410,NN)+ln(xl,320,xl,410,LN);
    s += cbPole(xn,410,NN,false) + cbPole(xl,410,LN) + link(xn-8,xl-8,436);
    s += `<ellipse cx="${(xn+xl)/2-4}" cy="488" rx="36" ry="9" fill="none" stroke="#33414e" stroke-width="1.8"/>`+link(xl-8,xl-8,476);
    s += ln(xn,470,xn,540,NN)+ln(xl,470,xl,540,LN);
    s += txt(xn-26,436,"Q6",{a:"end",b:1})+txt(xn-26,451,`1P+N ${P.rcd||""} A`,{a:"end",fs:11})+txt(xn-26,466,"30 mA type A",{a:"end",fs:11});
    s += boxR(830,540,110,42, t("sy_ac"), "");
    xAC = 885;
    // masses onduleur et tableau
    s += ln(600,300,586,300,G,3)+pe(`586,300 586,${YPE}`);
    s += pe(`940,561 1040,561 1040,${YPE}`)+txt(1046,556,"PE",{fs:11,c:G,b:1});
  }
  // ===== Masses reliées à la liaison équipotentielle =====
  s += ln(80,55,40,55,G,3)+pe(`40,55 40,${YPE}`)+txt(84,16,t("sy_frames"),{fs:11,c:G,b:1});
  s += ln(80,372,64,372,G,3)+pe(`64,372 64,${YPE}`);
  s += pe(`510,568 540,568 540,${YPE}`)+txt(544,564,t("sy_bat_cab"),{fs:10,c:G});
  if (S.dcEarth === "neg"){ // liaison unique du − batterie à la terre, au plus près de la batterie
    s += dot(400,yBus,MINUS)+pl(`400,${yBus} 400,512 345,512`,MINUS,2)+pe(`345,512 345,${YPE}`);
    s += txt(339,507,t("sy_negearth"),{a:"end",fs:10,c:G,b:1})+txt(339,521,`≥ ${String(P.sBatEarth).replace(".",",")} mm²`,{a:"end",fs:10,c:G});
  }
  // ===== Barrette + piquet de terre =====
  s += pe(`40,${YPE} 1080,${YPE}`);
  s += `<rect x="1050" y="${YPE-8}" width="34" height="16" fill="#fff" stroke="${G}" stroke-width="2"/>`+txt(1067,YPE-12,t("sy_bar"),{a:"middle",fs:10,c:G,b:1});
  s += earth(1067,YPE+8);
  s += txt(1000,652,t("sy_rod"),{a:"end",fs:11,c:G,b:1});
  s += txt(40,652,t("sy_le"),{fs:11,c:G});
  return s;
}

/* ---------- Schémas de couplage (modules / batteries) ---------- */
function coupling(R, kind){
  const pv = kind === "pv";
  const ns = pv ? R.ns : R.nbs, np = pv ? R.np : R.nbp;
  const W = pv ? 96 : 92, H = pv ? 58 : 52, GX = 38, GY = 34;
  const cols = Math.min(ns, 6), rows = Math.min(np, 4), cutS = ns > 6, cutP = np > 4;
  const x0 = 70, y0 = 34, RED = "#c62828", BLK = "#1f2933";
  const xEnd = x0 + cols*(W+GX) - GX, xm = x0 - 28, xp = xEnd + 28, xo = xp + 46;
  const yLast = y0 + (rows-1)*(H+GY), yb = yLast + H + (cutP ? 44 : 20);
  let g = "";
  for (let r = 0; r < rows; r++){
    const y = y0 + r*(H+GY), ym = y + H/2;
    for (let c = 0; c < cols; c++){
      const x = x0 + c*(W+GX);
      if (pv){
        g += `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="3" fill="#1d3f66" stroke="#33414e" stroke-width="1.5"/>`;
        for (let i = 1; i < 4; i++) g += `<line x1="${x+i*W/4}" y1="${y+3}" x2="${x+i*W/4}" y2="${y+H-3}" stroke="#7fa7d1" stroke-width=".7"/>`;
        g += `<line x1="${x+3}" y1="${ym}" x2="${x+W-3}" y2="${ym}" stroke="#7fa7d1" stroke-width=".7"/>`;
        g += `<text x="${x+W/2}" y="${ym+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" stroke="#1d3f66" stroke-width="3" paint-order="stroke">${U(S.mP+" Wc")}</text>`;
      } else {
        g += `<rect x="${x}" y="${y+6}" width="${W}" height="${H-6}" rx="4" fill="${S.tech==="lfp"?"#dff0e5":"#eceff2"}" stroke="#33414e" stroke-width="1.5"/>`;
        g += `<rect x="${x+10}" y="${y}" width="12" height="6" fill="#33414e"/><rect x="${x+W-22}" y="${y}" width="12" height="6" fill="#33414e"/>`;
        g += `<text x="${x+W/2}" y="${ym+4}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">${S.bU} V</text><text x="${x+W/2}" y="${ym+19}" text-anchor="middle" font-size="11.5" fill="#1f2933">${S.bC} Ah</text>`;
      }
      // bornes : − à gauche, + à droite
      g += `<circle cx="${x}" cy="${ym}" r="3.5" fill="#fff" stroke="${BLK}" stroke-width="1.5"/><circle cx="${x+W}" cy="${ym}" r="3.5" fill="#fff" stroke="${RED}" stroke-width="1.5"/>`;
      g += `<text x="${x+7}" y="${y-5}" font-size="15" font-weight="700" fill="${BLK}">−</text><text x="${x+W-14}" y="${y-5}" font-size="15" font-weight="700" fill="${RED}">+</text>`;
      if (c < cols-1){
        const dash = cutS && c === cols-2;
        g += `<line x1="${x+W+3.5}" y1="${ym}" x2="${x+W+GX-3.5}" y2="${ym}" stroke="#555" stroke-width="2.5"${dash?' stroke-dasharray="4 4"':""}/>`;
        if (dash) g += `<text x="${x+W+GX/2}" y="${ym-8}" text-anchor="middle" font-size="12" fill="#555">×${ns}</text>`;
      }
    }
    g += `<line x1="${x0-3.5}" y1="${ym}" x2="${xm}" y2="${ym}" stroke="${BLK}" stroke-width="2.5"/>`;
    g += `<line x1="${xEnd+3.5}" y1="${ym}" x2="${xp}" y2="${ym}" stroke="${RED}" stroke-width="2.5"/>`;
  }
  const ym0 = y0 + H/2, ymL = yLast + H/2;
  if (cutP) g += `<text x="${x0}" y="${yLast+H+26}" font-size="14" fill="#555">⋮ ${np} ${t("branches")}</text>`;
  g += `<polyline points="${xm},${ym0} ${xm},${yb} ${xo},${yb}" fill="none" stroke="${BLK}" stroke-width="2.5"/>`;
  g += `<polyline points="${xp},${ymL} ${xp},${ym0} ${xo},${ym0}" fill="none" stroke="${RED}" stroke-width="2.5"/>`;
  rows > 1 && (g += `<circle cx="${xm}" cy="${ym0}" r="3" fill="${BLK}"/>`);
  for (let r = 1; r < rows; r++){ const ym = y0 + r*(H+GY) + H/2; g += `<circle cx="${xm}" cy="${ym}" r="3" fill="${BLK}"/><circle cx="${xp}" cy="${ym}" r="3" fill="${RED}"/>`; }
  g += `<text x="${xo+8}" y="${ym0+5}" font-size="16" font-weight="700" fill="${RED}">+</text><text x="${xo+8}" y="${yb+5}" font-size="16" font-weight="700" fill="${BLK}">−</text>`;
  const uOut = pv ? ns*S.mVmp : ns*S.bU;
  g += `<text x="${xo+26}" y="${(ym0+yb)/2-4}" font-size="15" font-weight="700" fill="#1f2933">${nf(uOut,1)} V ⎓</text>`;
  g += `<text x="${xo+26}" y="${(ym0+yb)/2+15}" font-size="13" fill="#5f6b76">${t(pv ? "to_reg" : "to_reg")} →</text>`;
  const Wt = xo + 170, Ht = yb + 14;
  const cap = pv
    ? `${t("cpl_pv")} : ${ns} ${t("series")} × ${np} ${t("parallel")} — U = ${ns} × ${nf(S.mVmp,1)} = ${nf(ns*S.mVmp,1)} V ; I = ${np} × ${nf(S.mImp,2)} = ${nf(np*S.mImp,1)} A ; P = ${U(nf(R.pcInst,0)+" Wc")}`
    : `${t("cpl_bat")} : ${ns} ${t("series")} × ${np} ${t("parallel")} — U = ${ns} × ${S.bU} = ${ns*S.bU} V ; C = ${np} × ${S.bC} = ${np*S.bC} Ah`;
  return `<svg viewBox="0 0 ${Wt} ${Ht}" width="${Wt}" role="img" aria-label="${esc(cap)}">${g}</svg><p>${cap}</p>`;
}

/* ---------- Synoptique (SVG) ---------- */
function synoptic(R){
  const DC="#85340A", AC="#3f7fb8";
  const box = (x,y,w,h,lbl,sub,inner,top) => { const y1 = top ? y-26 : y+h+20, y2 = top ? y-9 : y+h+38; return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#fff" stroke="#33414e" stroke-width="2"/>${inner||""}
    <text x="${x+w/2}" y="${y1}" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2933">${esc(lbl)}</text>
    <text x="${x+w/2}" y="${y2}" text-anchor="middle" font-size="13" fill="#5f6b76">${esc(U(sub))}</text></g>`; };
  const conv = (x,y,w,h,top,bot) => `<line x1="${x+6}" y1="${y+h-6}" x2="${x+w-6}" y2="${y+6}" stroke="#33414e" stroke-width="1.5"/>
    <text x="${x+16}" y="${y+28}" font-size="20" font-weight="700" fill="#33414e">${top}</text><text x="${x+w-16}" y="${y+h-12}" text-anchor="end" font-size="20" font-weight="700" fill="#33414e">${bot}</text>`;
  const wire = (pts, col) => `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ar${col===DC?"d":"a"})"/>`;
  const pvArr = (x,y,w,h,ns,np) => { // dessin des modules
    let s=""; const cols=Math.min(ns,6), rows=Math.min(np,4); const cw=(w-12)/cols, ch=(h-12)/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const X=x+6+c*cw, Y=y+6+r*ch;
      s+=`<rect x="${X+1.5}" y="${Y+1.5}" width="${cw-3}" height="${ch-3}" fill="#1d3f66" stroke="#9fc3e6" stroke-width="1"/>
          <line x1="${X+cw/2}" y1="${Y+2}" x2="${X+cw/2}" y2="${Y+ch-2}" stroke="#9fc3e6" stroke-width=".7"/><line x1="${X+2}" y1="${Y+ch/2}" x2="${X+cw-2}" y2="${Y+ch/2}" stroke="#9fc3e6" stroke-width=".7"/>`; }
    return s; };
  const batt = (x,y,w,h) => `<rect x="${x+18}" y="${y+26}" width="${w-36}" height="${h-40}" rx="4" fill="${S.tech==="lfp"?"#dff0e5":"#eceff2"}" stroke="#33414e" stroke-width="1.5"/>
    <rect x="${x+30}" y="${y+18}" width="14" height="8" fill="#33414e"/><rect x="${x+w-44}" y="${y+18}" width="14" height="8" fill="#33414e"/>
    <text x="${x+37}" y="${y+46}" text-anchor="middle" font-size="16" font-weight="700" fill="#b3261e">+</text><text x="${x+w-37}" y="${y+46}" text-anchor="middle" font-size="18" font-weight="700" fill="#33414e">−</text>`;
  const house = (cx,cy) => `<path d="M${cx-22},${cy+20} V${cy-4} L${cx},${cy-24} L${cx+22},${cy-4} V${cy+20} Z M${cx-6},${cy+20} V${cy+6} H${cx+6} V${cy+20}" fill="#fff4d6" stroke="#33414e" stroke-width="2" stroke-linejoin="round"/>`;
  const bulb = (cx,cy) => `<circle cx="${cx}" cy="${cy-6}" r="13" fill="#fff4d6" stroke="#33414e" stroke-width="2"/><path d="M${cx-9},${cy-15} L${cx+9},${cy+3} M${cx+9},${cy-15} L${cx-9},${cy+3}" stroke="#33414e" stroke-width="1.6"/><rect x="${cx-6}" y="${cy+8}" width="12" height="8" fill="#33414e"/>`;
  const defs = `<defs>${[["d",DC],["a",AC]].map(([k,c])=>`<marker id="ar${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join("")}</defs>`;
  const sunMini = `<g transform="translate(70,60) scale(.22)">${document.querySelector(".logo").innerHTML}</g>`;
  const peLine = (pts) => `<polyline points="${pts}" fill="none" stroke="#2e9e4f" stroke-width="2.5"/><polyline points="${pts}" fill="none" stroke="#f2c200" stroke-width="2.5" stroke-dasharray="6 6"/>`;
  const earthSym = (x,y) => `<g stroke="#2e9e4f" stroke-width="2.5"><line x1="${x}" y1="${y}" x2="${x}" y2="${y+10}"/><line x1="${x-12}" y1="${y+10}" x2="${x+12}" y2="${y+10}"/><line x1="${x-7}" y1="${y+15}" x2="${x+7}" y2="${y+15}"/><line x1="${x-3}" y1="${y+20}" x2="${x+3}" y2="${y+20}"/></g>`;
  const legend = `<g font-size="13" fill="#5f6b76" transform="translate(0,28)"><g transform="translate(-150,0)">${peLine("640,360 670,360")}<text x="676" y="364">PE (${t("sy_le_short")})</text></g><line x1="640" y1="360" x2="670" y2="360" stroke="${DC}" stroke-width="3.5"/><text x="676" y="364">DC ⎓</text>
    <line x1="740" y1="360" x2="770" y2="360" stroke="${AC}" stroke-width="3.5"/><text x="776" y="364">AC ~ 230 V</text></g>`;
  if (S.mode==="isole"){
    let s = defs + sunMini;
    s += box(130,40,170,110, t("sy_pv"), `${R.ns}S × ${R.np}P — ${num(R.pcInst)} Wc`, pvArr(130,40,170,110,R.ns,R.np));
    s += box(390,55,110,80, t("sy_reg"), R.regModel ? `${R.regModel.n} × ${R.regModel.name.replace("SmartSolar ","")}` : `${S.regType} ${R.regStd||">200"} A`, conv(390,55,110,80,"=","="), true);
    s += box(375,215,140,90, t("sy_bat"), `${R.U} V — ${num(R.cInst)} Ah`, batt(375,215,140,90));
    s += wire("300,95 384,95", DC);
    s += wire("445,135 445,208", DC);
    if (R.ondStd){
      s += box(620,55,110,80, t("sy_ond"), R.ondModel ? R.ondModel.name.replace("Xtender ","") : `${R.ondStd} VA`, conv(620,55,110,80,"=","~"), true);
      s += wire("515,250 575,250 575,95 614,95", DC);
      s += box(810,55,120,80, t("sy_ac"), `${num(R.pAC)} W`, house(870,95), true);
      s += wire("730,95 804,95", AC);
    }
    const yPE = 362;
    s += peLine(`130,140 108,140 108,${yPE} 945,${yPE}`) + earthSym(108,yPE);
    s += peLine(`390,120 372,120 372,${yPE}`) + peLine(`375,290 360,290 360,${yPE}`);
    if (R.ondStd) s += peLine(`620,120 602,120 602,${yPE}`) + peLine(`930,120 945,120 945,${yPE}`);
    if (R.eDC>0){
      s += box(620,230,110,70, t("sy_dc"), `${num(R.eDC)} Wh/j`, bulb(675,262));
      s += wire("515,270 614,270", DC);
    }
    return s + legend;
  } else {
    let s = defs + sunMini;
    s += box(130,40,170,110, t("sy_pv"), `${R.n} × ${S.mP} Wc — ${num(R.pcInst/1000,2)} kWc`, pvArr(130,40,170,110,Math.min(R.n,6),Math.ceil(R.n/6)));
    s += box(380,55,110,80, t("sy_ond"), `${R.ondStd} W`, conv(380,55,110,80,"=","~"), true);
    s += box(560,55,110,80, t("sy_board"), "230 V ~", `<g stroke="#33414e" stroke-width="1.5" fill="none">${[0,1,2,3].map(i=>`<rect x="${578+i*19}" y="78" width="12" height="34" rx="2"/>`).join("")}</g>`, true);
    s += box(560,230,110,70, t("sy_loads"), `${num(S.consoYear)} kWh/an`, house(615,262));
    s += box(740,55,90,80, t("sy_meter"), "", `<rect x="758" y="72" width="54" height="26" fill="#e8f2fb" stroke="#33414e"/><text x="785" y="90" text-anchor="middle" font-size="13" font-family="monospace">kWh</text>`, true);
    s += box(880,70,60,50, t("sy_grid"), "", `<path d="M895,115 L910,78 L925,115 M900,100 L920,100" stroke="#33414e" stroke-width="2" fill="none"/>`, true);
    s += wire("300,95 374,95", DC) + wire("490,95 554,95", AC) + wire("615,135 615,223", AC) + `<polyline points="670,95 734,95" stroke="${AC}" stroke-width="3.5" marker-end="url(#ara)" marker-start="url(#ara)" fill="none"/>` + wire("830,95 874,95", AC);
    return s + legend;
  }
}

function brandModule(id){ for (const [,list] of MOD_BRANDS){ const m = list.find(m => m[0]===id); if (m) return m; } return null; }
function modName(){ const b = brandModule(S.mod); return b ? b[1] : (MOD_TD[S.mod] ? MOD_TD[S.mod][0].split(" (")[0] : ""); }
function applyModule(){
  S.mIrm = /^jk/.test(S.mod) ? 30 : 25;
  const b = brandModule(S.mod); if (b){ [S.mP,S.mVmp,S.mImp,S.mVoc,S.mIsc,S.mArea,S.mUnom] = b.slice(2); return; }
  const m = MODULES.find(m=>m[0]===S.mod), td = MOD_TD[S.mod];
  if (m && S.mod!=="mcustom") [S.mP,S.mVmp,S.mImp,S.mVoc,S.mIsc,S.mArea,S.mUnom] = m.slice(2);
  else if (td) [S.mP,S.mVmp,S.mImp,S.mVoc,S.mIsc,S.mArea,S.mUnom] = td.slice(1);
}

/* ---------- Événements ---------- */
function setNum(key, v){ const x = parseFloat(String(v).replace(",", ".")); if (isFinite(x)) S[key] = x; }
function bind(){
  const map = {pName:"name",pAuthor:"author"};
  for (const id in map) $(id).addEventListener("input", e => { S[map[id]] = e.target.value; render(); });
  $("modeSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; S.mode=b.dataset.v; fillInputs(); renderTabs(); render(); });
  $("city").addEventListener("change", e => { S.city=e.target.value; const c=CITIES.find(c=>c[0]===S.city); if (c && S.city!=="custom"){ S.hDec=c[2]; S.hSum=c[3]; S.hYear=c[4]; } fillInputs(); render(); });
  $("period").addEventListener("change", e => { S.period=e.target.value; render(); });
  [["hDec","hDec"],["hSum","hSum"],["hYear","hYear"]].forEach(([id,k]) => $(id).addEventListener("input", e => { const x=parseFloat(e.target.value.replace(",",".")); if (isFinite(x) && x>0) S[k]=x/1000; S.city="custom"; $("city").value="custom"; render(); }));
  $("batRate").addEventListener("change", e => { S.rate20=e.target.value; render(); });
  $("exSel").addEventListener("change", e => { const ex=EXAMPLES[e.target.value]; if(!ex) return; S=Object.assign(defaults(), JSON.parse(JSON.stringify(ex))); applyModule(); fillInputs(); renderTabs(); render(); $("exMsg").innerHTML = msg("ok", t("ex_loaded")); e.target.value=""; });
  [["etaOnd","eta"],["simult","simult"],["consoYear","consoYear"],["rate","rate"],["kLoss","k"],["regVmax","regVmax"],["nsForce","nsForce"],["pr","pr"],["batD","bD"],["batDays","days"]]
    .forEach(([id,k]) => $(id).addEventListener("input", e => { setNum(k, e.target.value); render(); }));
  [["mP","mP"],["mVmp","mVmp"],["mImp","mImp"],["mVoc","mVoc"],["mIsc","mIsc"],["mArea","mArea"]].forEach(([id,k]) => $(id).addEventListener("input", e => { setNum(k, e.target.value); S.mod="mcustom"; $("modPreset").value="mcustom"; render(); }));
  $("mUnom").addEventListener("change", e => { S.mUnom=+e.target.value; render(); });
  $("modPreset").addEventListener("change", e => { S.mod=e.target.value; applyModule(); fillInputs(); render(); });
  $("usysMode").addEventListener("change", e => { S.usysMode=e.target.value; render(); });
  $("regBrand").addEventListener("change", e => { S.regBrand=e.target.value; S.regForce=""; fillInputs(); render(); });
  $("ondBrand").addEventListener("change", e => { S.ondBrand=e.target.value; S.ondForce=""; render(); });
  [["protBrand","protBrand"],["dcbBrand","dcbBrand"],["bldg","bldg"]].forEach(([id,k]) => $(id).addEventListener("change", e => { S[k]=e.target.value; render(); }));
  $("lightning").addEventListener("change", e => { S.lightning=+e.target.value; render(); });
  $("dcEarth").addEventListener("change", e => { S.dcEarth=e.target.value; render(); });
  $("docBody").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const tr = e.target.closest("[data-pick]"); if (!tr) return;
    const [kind, b, ...rest] = tr.dataset.pick.split(":"); const id = rest.join(":");
    if (kind==="mod"){ S.mod=b; applyModule(); }
    else if (kind==="bat"){ const x=BATTS.find(x=>x[0]===b); S.bat=b; S.tech=x[2]; S.bU=x[3]; S.bC=x[4]; S.bD = S.tech==="pb"?0.7:0.8; }
    else if (kind==="reg"){ S.regBrand=b; S.regForce=`${b}:${id}`; S.regType="MPPT"; }
    else if (kind==="ond"){ S.ondBrand=b; S.ondForce=`${b}:${id}`; }
    else if (kind==="prot"){ S.protBrand=b; }
    else if (kind==="dcb"){ S.dcbBrand=b; }
    fillInputs(); render();
  });
  $("bAutoPick").addEventListener("click", () => { S.regForce=""; S.ondForce=""; render(); });
  [["mIrm","mIrm"],["ng","ng"]].forEach(([id,k]) => $(id).addEventListener("input", e => { setNum(k, e.target.value); render(); }));
  $("regType").addEventListener("change", e => { S.regType=e.target.value; fillInputs(); render(); });
  $("orient").addEventListener("change", e => { S.orient=e.target.value; render(); });
  $("tilt").addEventListener("change", e => { S.tilt=+e.target.value; render(); });
  $("batPreset").addEventListener("change", e => { S.bat=e.target.value; const b=BATTS.find(b=>b[0]===S.bat); if (b && S.bat!=="bcustom"){ S.tech=b[2]; S.bU=b[3]; S.bC=b[4]; S.bD = S.tech==="pb"?0.7:0.8; } fillInputs(); render(); });
  $("batTech").addEventListener("change", e => { S.tech=e.target.value; S.bD = S.tech==="pb"?0.7:0.8; S.bat="bcustom"; fillInputs(); render(); });
  $("batU").addEventListener("change", e => { S.bU=+e.target.value; S.bat="bcustom"; $("batPreset").value="bcustom"; render(); });
  $("batC").addEventListener("input", e => { setNum("bC", e.target.value); S.bat="bcustom"; $("batPreset").value="bcustom"; render(); });
  // tableau des appareils
  const tb = $("loads").querySelector("tbody");
  tb.addEventListener("input", e => { const tr=e.target.closest("tr"); if(!tr) return; const L=S.loads[+tr.dataset.r]; const f=e.target.dataset.f;
    if (f==="n"){ L.n=e.target.value; L.k=""; } else if (f==="ty"||f==="per"){ L[f]=e.target.value; if (f==="per") { renderLoads(); } } else { const x=parseFloat(e.target.value.replace(",",".")); L[f]=isFinite(x)?x:0; } render(); });
  tb.addEventListener("change", e => { const f=e.target.dataset.f; if (f==="ty"||f==="per"){ const L=S.loads[+e.target.closest("tr").dataset.r]; L[f]=e.target.value; render(); } });
  tb.addEventListener("click", e => { const b=e.target.closest("[data-del]"); if(!b) return; S.loads.splice(+b.dataset.del,1); renderLoads(); render(); });
  $("bAdd").addEventListener("click", () => { const k=$("preset").value; if(!k) return; const a=APPLIANCES.find(a=>a[0]===k); S.loads.push(L0({k, p:a[1], h:a[2], ty:a[3], v:a[4]||0, ku:a[5]??1, ks:a[6]??1})); renderLoads(); render(); });
  $("bAddEmpty").addEventListener("click", () => { S.loads.push(L0({})); renderLoads(); render(); });
  // câbles
  $("cabT").addEventListener("change", e => { const el=e.target; const x=parseFloat(el.value.replace(",",".")); if(!isFinite(x)) return;
    const id = el.dataset.cl || el.dataset.cd; const isL = !!el.dataset.cl;
    const key = id==="g" ? (isL?"lg":"dg") : (isL?"l":"d")+id; S.cab[key]=x; render(); });
  // navigation
  document.addEventListener("click", e => {
    const tb=e.target.closest("[data-tab]"); if (tb){ tab=+tb.dataset.tab; renderTabs(); window.scrollTo(0,0); return; }
    const g=e.target.closest("[data-go]"); if (g){ tab=+g.dataset.go; renderTabs(); window.scrollTo(0,0); return; }
    const l=e.target.closest("[data-l]"); if (l){ lang=l.dataset.l; try{localStorage.setItem("solarduo.lang",lang);}catch(_){} applyI18n(); fillInputs(); renderTabs(); render(); }
  });
  // fichiers
  $("bNew").addEventListener("click", () => { S=defaults(); tab=0; fillInputs(); renderTabs(); render(); });
  $("bSave").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = (S.name ? S.name.replace(/[^\w\-àâäéèêëîïôöùûüç ]+/gi,"_").trim() : "projet") + ".solarduo";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
  });
  $("bOpen").addEventListener("click", () => $("fOpen").click());
  $("fOpen").addEventListener("change", e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload = () => loadProject(r.result); r.readAsText(f); e.target.value=""; });
  // application de bureau : fichier ouvert par double-clic, mise à jour disponible
  if (window.solarDuoDesktop) { window.solarDuoDesktop.onOpen(loadProject); window.solarDuoDesktop.onUpdate(showUpdate); }
  const pr = () => { const old=tab; tab=SUM_TAB; renderTabs(); setTimeout(()=>{ window.print(); tab=old; renderTabs(); }, 50); };
  $("bPrint").addEventListener("click", pr); $("bPrint2").addEventListener("click", pr);
}


function loadProject(txt){
  try { const o=JSON.parse(txt); if (!o || !Array.isArray(o.loads)) throw 0; S=Object.assign(defaults(), o); S.cab=Object.assign(defaults().cab, o.cab||{}); S.loads=S.loads.map(L0); applyModule(); tab=0; fillInputs(); renderTabs(); render(); }
  catch(_){ $("rSite").insertAdjacentHTML("beforebegin", msg("err", t("bad_file"))); }
}
function showUpdate(u){
  if (!u || !u.version || $("updBar")) return;
  const d=document.createElement("div"); d.id="updBar"; d.className="noprint";
  d.style.cssText="position:sticky;top:0;z-index:50;background:#1d6fb8;color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px";
  d.innerHTML=`<span>${esc(t("upd_msg").replace("{v}",u.version))}</span><a href="${esc(u.url)}" target="_blank" rel="noopener" style="color:#fff;font-weight:700;text-decoration:underline">${esc(t("upd_dl"))}</a><button type="button" style="background:none;border:1px solid #fff;color:#fff;border-radius:4px;cursor:pointer;padding:1px 8px" aria-label="×">×</button>`;
  d.querySelector("button").onclick=()=>d.remove(); document.body.prepend(d);
}
/* ---------- Démarrage ---------- */
try { const q = new URLSearchParams(location.search).get("lang"); if (q && I18N[q]) { lang = q; } else { const l = localStorage.getItem("solarduo.lang"); if (l && I18N[l]) lang = l; else { const n=(navigator.language||"fr").slice(0,2); lang = I18N[n] ? n : "en"; } } } catch(_){}
applyI18n(); fillInputs(); bind(); renderTabs(); render();
</script>
